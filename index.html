<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta property="og:image" content="https://geolhc.github.io/george-city/moontide-lane.jpg"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2372dcd4'/%3E%3C/svg%3E"><meta name="description" content="Explore Moontide Lane, a playable futuristic Hong Kong district with Cantonese missions, NOVA SYNC, a playable cha chaan teng and City Scan."><meta name="theme-color" content="#161e35"><title>GEORGE CITY 2099 · New Horizon</title></head><body>
<canvas id="world" aria-label="月潮里第三身遊戲世界"></canvas>
<header><div class="brand"><b class="crest" aria-hidden="true">◒</b><div><strong>GEORGE CITY <em>2099</em></strong><small>V0.2　/　NEW HORIZON</small></div></div><nav><button id="scan" aria-label="City Scan 掃描" title="City Scan · Q"><span aria-hidden="true">⌖</span></button><button id="sound" aria-label="聲音設定">♫</button><button id="journal" aria-label="City OS">City OS</button></nav></header>
<section id="tracker"><small id="kicker">DISTRICT 01　/　月潮里</small><h1 id="title">Moontide Lane</h1><p id="objective">行近發光標記，接第一個委託。</p><p id="pulse-objective" hidden></p></section>
<aside id="nova" aria-label="NOVA 城市嚮導">
<button id="nova-toggle" aria-controls="nova-copy" aria-expanded="true"><i aria-hidden="true"></i>NOVA</button>
<div id="nova-copy"><p id="nova-line" role="status"></p><button id="nova-hint">提示</button></div>
</aside>
<div id="toast" role="status"></div>
<div id="radar"><canvas width="160" height="160" id="map" aria-label="小地圖，北向上"></canvas><div><i></i><span id="clock">20:00</span> HKT</div></div>
<div id="hint"><kbd>WASD</kbd> 移動　 <kbd>SHIFT</kbd> 跑　 拖曳環視</div>
<div id="stick" aria-label="移動搖桿"><i></i></div><button id="sprint" aria-label="切換跑步">跑</button>
<button id="act"><kbd>E</kbd> <span>互動</span></button>
<dialog id="panel"><button id="close" aria-label="關閉">×</button><small>GEORGE CITY 2099　/　The Future Is Yours.</small><h2></h2><section id="content"></section></dialog>
<dialog id="activity" aria-labelledby="activity-title"><div class="activity-heading"><h2 id="activity-title"></h2><div class="activity-head-actions"><button data-sound>音效 關</button><button data-exit>返月潮里</button></div></div><main></main></dialog>
<script type="module" src="/src/main.ts"></script></body></html>
